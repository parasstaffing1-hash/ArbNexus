name: ArbNexus CI / Quality & Safety Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  ENABLE_EXECUTION: 'false'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  audit-and-safety:
    name: DevSecOps Safety & Licensing Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assert Execution Is Disabled
        run: |
          echo "Verifying ENABLE_EXECUTION is strictly false"
          if [ "$ENABLE_EXECUTION" != "false" ]; then
            echo "CRITICAL: ENABLE_EXECUTION must never be enabled in CI or automated builds!"
            exit 1
          fi

      - name: Verify Secret Leak Prevention
        run: |
          echo "Scanning for accidental hardcoded private keys or live credentials..."
          ! grep -rE "0x[a-fA-F0-9]{64}" packages/ apps/ --exclude-dir=node_modules || {
            echo "Potential private key pattern detected. Review secrets before committing."
          }

  build-and-test:
    name: Build, Typecheck & Property Test
    runs-on: ubuntu-latest
    needs: audit-and-safety
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Run Monorepo Type Check
        run: pnpm type-check

      - name: Run Financial Invariant & Calculator Property Tests
        run: pnpm test

      - name: Build Packages and Applications
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/arbnexus?schema=public'
          JWT_SECRET: 'ci-dummy-jwt-secret-at-least-32-chars-long'
