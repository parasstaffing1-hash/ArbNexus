packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  bigint-buffer: true
  bufferutil: true
  ccxt: true
  esbuild: true
  keccak: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  tree-sitter: true
  utf-8-validate: true
  workerd: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - 'argon2'
  - 'bigint-buffer'
  - 'bufferutil'
  - 'ccxt'
  - 'esbuild'
  - 'keccak'
  - 'msgpackr-extract'
  - 'prisma'
  - 'tree-sitter'
  - 'utf-8-validate'
  - 'workerd'
