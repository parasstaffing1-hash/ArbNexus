global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'arbitrage-api'
    metrics_path: '/api/v1/health/metrics'
    static_configs:
      - targets: ['host.docker.internal:4000', 'api:4000']

  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
